name: Polyglot CI Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # --- .NET Backend Validation ---
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore .NET Dependencies
      run: dotnet restore
      working-directory: backend-dotnet

    - name: Run .NET Linter/Format Check
      run: dotnet format --verify-no-changes
      working-directory: backend-dotnet

    - name: Run .NET Tests
      run: dotnet test --no-restore
      working-directory: backend-dotnet

    # --- Python Worker Validation ---
    - name: Setup Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: worker-python/requirements.txt

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest
      working-directory: worker-python

    - name: Run Python Linting (Flake8)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      working-directory: worker-python

    - name: Run Python Worker Tests
      run: pytest .
      working-directory: worker-python

    # --- JavaScript Frontend Validation ---
    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend-js/package.json

    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: frontend-js

    - name: Run Frontend Linting
      run: npm run lint --if-present
      working-directory: frontend-js

    - name: Run Frontend Tests
      run: npm test -- --watchAll=false --passWithNoTests
      working-directory: frontend-js

  build-and-publish:
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push .NET Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend-dotnet
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/polyglot-backend:latest

    - name: Build and Push Python Worker Image
      uses: docker/build-push-action@v5
      with:
        context: ./worker-python
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/polyglot-worker:latest

    - name: Build and Push JS Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend-js
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/polyglot-frontend:latest